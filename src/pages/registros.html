<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Crear Cuenta | Comida Chilena</title>

    <link rel="stylesheet" href="../css/auth-styles.css" />
  </head>

  <body>
    <main class="auth-container">
      <section class="auth-card">
        <h1>Crear Cuenta</h1>

        <p class="auth-subtitle">Regístrate para comprar nuestros productos</p>

        <form id="registroForm">
          <!-- RUT -->
          <div class="form-group">
            <label for="rut">RUT</label>
            <input
              type="text"
              id="rut"
              name="rut"
              placeholder="11111111-1"
              maxlength="10"
            />
            <small id="rutError" class="error-message"></small>
          </div>

          <!-- Nombre -->
          <div class="form-group">
            <label for="nombre">Nombre</label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              placeholder="Tu nombre"
              maxlength="50"
            />
            <small id="nombreError" class="error-message"></small>
          </div>

          <!-- Apellidos -->
          <div class="form-group">
            <label for="apellidos">Apellidos</label>
            <input
              type="text"
              id="apellidos"
              name="apellidos"
              placeholder="Tus apellidos"
              maxlength="100"
            />
            <small id="apellidosError" class="error-message"></small>
          </div>

          <!-- Correo -->
          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="ejemplo@gmail.com"
              maxlength="100"
            />
            <small id="emailError" class="error-message"></small>
          </div>

          <!-- Contraseña -->
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Entre 4 y 10 caracteres"
            />
            <small id="passwordError" class="error-message"></small>
          </div>

          <!-- Fecha de nacimiento -->
          <div class="form-group">
            <label for="fechaNacimiento">Fecha de nacimiento</label>
            <input type="date" id="fechaNacimiento" name="fechaNacimiento" />
            <small id="fechaNacimientoError" class="error-message"></small>
          </div>

          <!-- Región -->
          <div class="form-group">
            <label for="region">Región</label>
            <select id="region" name="region">
              <option value="">Selecciona una región</option>
            </select>
            <small id="regionError" class="error-message"></small>
          </div>

          <!-- Comuna -->
          <div class="form-group">
            <label for="comuna">Comuna</label>
            <select id="comuna" name="comuna" disabled>
              <option value="">Selecciona una comuna</option>
            </select>
            <small id="comunaError" class="error-message"></small>
          </div>

          <!-- Dirección -->
          <div class="form-group">
            <label for="direccion">Dirección</label>
            <input
              type="text"
              id="direccion"
              name="direccion"
              placeholder="Calle y número"
              maxlength="300"
            />
            <small id="direccionError" class="error-message"></small>
          </div>

          <button type="submit" id="registroButton">Crear Cuenta</button>

          <p id="registroMessage" class="form-message"></p>

          <button type="button" id="reenviarCorreo">
            Reenviar correo de confirmación
          </button>
        </form>

        <p class="register-link">
          ¿Ya tienes una cuenta?
          <a href="login.html">Iniciar sesión</a>
        </p>
      </section>
    </main>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Configuración de Supabase -->
    <script src="../js/supabase.js"></script>

    <!-- Regiones y comunas -->
    <script src="../js/regiones.js"></script>

    <!-- Lógica del Registro -->
    <script src="../js/registro.js"></script>
  </body>
</html>
