<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Iniciar Sesión | Comida Chilena</title>

    <link rel="stylesheet" href="../css/home-styles.css" />
    <link rel="stylesheet" href="../css/auth-styles.css" />
    <link rel="stylesheet" href="../css/animaciones.css" />
  </head>

  <body>
    <main class="auth-container">
      <section class="auth-card">
        <h1>Iniciar Sesión</h1>

        <p class="auth-subtitle">Ingresa a tu cuenta</p>

        <form id="loginForm">
          <div class="form-group">
            <label for="login-email">Correo electrónico</label>
            <input
              type="email"
              id="login-email"
              name="email"
              maxlength="100"
              placeholder="ejemplo@gmail.com"
              autocomplete="email"
              required
            />
            <small
              id="login-emailError"
              class="error-message"
              aria-live="polite"
            ></small>
          </div>

          <div class="form-group">
            <label for="login-password">Contraseña</label>
            <input
              type="password"
              id="login-password"
              name="password"
              placeholder="Ingresa tu contraseña"
              autocomplete="current-password"
              required
            />
            <small
              id="login-passwordError"
              class="error-message"
              aria-live="polite"
            ></small>
          </div>

          <button type="submit" id="loginButton" class="btn">
            Iniciar Sesión
          </button>

          <p id="loginMessage" class="form-message" aria-live="polite"></p>
        </form>

        <p class="register-link">
          ¿No tienes una cuenta?
          <a href="registros.html">Crear cuenta</a>
        </p>

        <a href="index.html" class="auth-volver">&larr; Volver a la tienda</a>
      </section>
    </main>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Configuración de Supabase -->
    <script src="../js/supabase.js"></script>

    <!-- Lógica del Login -->
    <script src="../js/login.js"></script>
    <script src="../js/animaciones.js"></script>
  </body>
</html>
